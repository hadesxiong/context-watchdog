<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon 与站点/扩展的标记同形（盾牌 + 四点掩码）。
       独立文件里拿不到页面 CSS 变量，因此自带 prefers-color-scheme 切换，
       在亮色与暗色浏览器界面上都能看清。 -->
  <style>
    .shield { fill: #18181b; }
    .dot { fill: #fafafa; }
    .inner { stroke: #fafafa; stroke-opacity: 0.25; }
    @media (prefers-color-scheme: dark) {
      .shield { fill: #fafafa; }
      .dot { fill: #18181b; }
      .inner { stroke: #18181b; }
    }
  </style>
  <rect width="32" height="32" rx="6" fill="transparent"></rect>
  <path
    class="shield"
    d="M16 2.5 L5 6.5 V15 C5 22.2 9.8 27.9 16 29.5 C22.2 27.9 27 22.2 27 15 V6.5 Z"></path>
  <path
    class="inner"
    d="M16 5.2 L7.6 8.2 V15 C7.6 20.8 11.3 25.6 16 27 C20.7 25.6 24.4 20.8 24.4 15 V8.2 Z"
    stroke-width="1"
    fill="none"></path>
  <circle class="dot" cx="10.5" cy="16" r="1.7"></circle>
  <circle class="dot" cx="14.2" cy="16" r="1.7"></circle>
  <circle class="dot" cx="17.9" cy="16" r="1.7"></circle>
  <circle class="dot" cx="21.6" cy="16" r="1.7"></circle>
</svg>
